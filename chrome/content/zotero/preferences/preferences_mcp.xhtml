<vbox id="zotero-prefpane-mcp"
	onload="Zotero_Preferences.MCP.init()"
	onunload="Zotero_Preferences.MCP.uninit()"
>
	<vbox class="main-section">
		<groupbox>
			<checkbox
				id="mcp-enabled"
				data-l10n-id="preferences-mcp-enable"
				preference="extensions.zotero.mcp.enabled"
				native="true"
			/>
			<description class="indented-pref" data-l10n-id="preferences-mcp-enable-description"/>
			<hbox id="mcp-server-disabled" class="indented-pref" align="center" hidden="true">
				<label data-l10n-id="preferences-advanced-server-disabled"/>
				<button
					data-l10n-id="preferences-advanced-server-enable-and-restart"
					oncommand="Zotero_Preferences.MCP.enableServer()"
				/>
			</hbox>
		</groupbox>
		
		<groupbox id="mcp-settings">
			<description data-l10n-id="preferences-mcp-apps-description"/>
			<description id="mcp-binary-missing" data-l10n-id="preferences-mcp-binary-missing" hidden="true"/>
			<hbox class="virtualized-table-container">
				<html:div id="mcp-apps"/>
			</hbox>
			<hbox class="mcp-apps-buttons">
				<button id="mcp-connect" disabled="true" oncommand="Zotero_Preferences.MCP.toggleConnection()"/>
				<button id="mcp-permissions" disabled="true" data-l10n-id="preferences-mcp-permissions"
					oncommand="Zotero_Preferences.MCP.openPermissions()"/>
				<spacer flex="1"/>
				<button id="mcp-forget" disabled="true" data-l10n-id="preferences-mcp-forget"
					oncommand="Zotero_Preferences.MCP.forgetSelected()"/>
			</hbox>
		</groupbox>
	</vbox>
</vbox>
